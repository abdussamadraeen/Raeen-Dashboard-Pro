<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <defs>
    <linearGradient id="robotAiBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="50%" stop-color="#7C3AED" />
      <stop offset="100%" stop-color="#9333EA" />
    </linearGradient>
    <linearGradient id="robotAiFace" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>
    <linearGradient id="robotAiGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#22D3EE" />
    </linearGradient>
  </defs>
  <!-- Background Chassis -->
  <rect x="2" y="2" width="44" height="44" rx="12" fill="url(#robotAiBg)" />
  <!-- Signal router waves on top -->
  <path d="M19 10 A 8 8 0 0 1 29 10" stroke="#38BDF8" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.9"/>
  <path d="M15 7 A 13 13 0 0 1 33 7" stroke="#E0E7FF" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.6"/>
  <!-- Center Router Antenna -->
  <line x1="24" y1="11" x2="24" y2="15" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="24" cy="11" r="2" fill="#38BDF8"/>
  <!-- Bot Head Screen / Face -->
  <rect x="9" y="16" width="30" height="24" rx="7" fill="url(#robotAiFace)" stroke="rgba(255,255,255,0.2)" stroke-width="1.5"/>
  <!-- Visor / Eyes -->
  <rect x="14" y="22" width="7" height="4.5" rx="2.25" fill="url(#robotAiGlow)"/>
  <rect x="27" y="22" width="7" height="4.5" rx="2.25" fill="url(#robotAiGlow)"/>
  <!-- Router Node / Mouth Grid -->
  <path d="M18 32 H30" stroke="#38BDF8" stroke-width="2" stroke-linecap="round" opacity="0.85"/>
  <circle cx="21" cy="32" r="1" fill="#FFFFFF"/>
  <circle cx="27" cy="32" r="1" fill="#FFFFFF"/>
  <!-- Ear Antenna Plugs -->
  <rect x="6" y="23" width="3" height="8" rx="1.5" fill="#C7D2FE"/>
  <rect x="39" y="23" width="3" height="8" rx="1.5" fill="#C7D2FE"/>
</svg>